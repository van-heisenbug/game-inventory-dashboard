<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Pixelshelf – Sign in</title>
    <link rel="stylesheet" href="css/storefront.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <main class="auth">
      <a href="storefront.html" class="brand">Pixelshelf</a>

      <div class="auth-card">
        <!-- Switch between the two forms (hidden radios, no JS) -->
        <div
          class="tabs"
          role="radiogroup"
          aria-label="Sign in or create account"
        >
          <label>
            <input
              type="radio"
              name="mode"
              id="mode-signin"
              class="sr-only"
              checked
            />
            Sign in
          </label>
          <label>
            <input type="radio" name="mode" id="mode-signup" class="sr-only" />
            Create account
          </label>
        </div>

        <!-- Sign in -->
        <form class="form form--signin" method="post">
          <h1>Welcome back</h1>
          <p class="form__lead">
            Sign in to see your orders and checkout faster.
          </p>

          <div class="field">
            <label for="signin-email">Email address</label>
            <input
              id="signin-email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>

          <div class="field">
            <label for="signin-password">Password</label>
            <input
              id="signin-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>

          <div class="row">
            <label class="check">
              <input type="checkbox" name="remember" />
              Remember me
            </label>
            <a href="forgot-password.html">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn--block">Sign in</button>

          <p class="switch">
            New here?
            <label for="mode-signup" class="link">Create an account</label>
          </p>
        </form>

        <!-- Create account -->
        <form class="form form--signup" method="post">
          <h1>Create your account</h1>
          <p class="form__lead">
            It takes a minute. You can change these details later.
          </p>

          <div class="field">
            <label for="signup-name">Full name</label>
            <input
              id="signup-name"
              name="name"
              type="text"
              autocomplete="name"
              required
            />
          </div>

          <div class="field">
            <label for="signup-email">Email address</label>
            <input
              id="signup-email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>

          <div class="field">
            <label for="signup-password">Password</label>
            <input
              id="signup-password"
              name="password"
              type="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
            <span class="hint">At least 8 characters.</span>
          </div>

          <div class="field">
            <label for="signup-confirm">Confirm password</label>
            <input
              id="signup-confirm"
              name="confirm-password"
              type="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </div>

          <label class="check">
            <input type="checkbox" name="terms" required />
            <span
              >I agree to the <a href="terms.html">Terms</a> and
              <a href="privacy.html">Privacy Policy</a></span
            >
          </label>

          <button type="submit" class="btn btn--block">Create account</button>

          <p class="switch">
            Already have an account?
            <label for="mode-signin" class="link">Sign in</label>
          </p>
        </form>
      </div>
    </main>
  </body>
</html>
